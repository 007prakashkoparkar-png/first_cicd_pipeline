name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Image
      run: docker build -t 007prakashkoparkar/my-devops-app:latest .
    - name: Login Docker Hub
      run: docker login -u ${{ vars.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Push Imagei
      run: docker push 007prakashkoparkar/my-devops-app:latest


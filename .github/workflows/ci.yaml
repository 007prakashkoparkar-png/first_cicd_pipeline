name: CI to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
        uses: docker/login-action@v4
      - name: Build Image
        run: docker build -t 007prakashkoparkar/my-devops-app:latest .
      - name: Login to Docker Hub
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Push Image
      run: docker push 007prakashkoparkar/my-devops-app:latest


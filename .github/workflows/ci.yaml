name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted  # 👈 Updates the pipeline to run locally on your k8s-master node
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t 007prakashkoparkar/my-cicd-app:v1 .

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: 007prakashkoparkar
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image
        run: docker push 007prakashkoparkar/my-cicd-app:v1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Deploy Chart to Kubernetes
        run: |
          helm uninstall my-devops-app
